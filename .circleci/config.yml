version: 2.1

# Default settings for executors

orbs:
  win: circleci/windows@5.0.0

defaults: &defaults
  working_directory: ~/repo
  environment:
    JAVA_OPTS: -Xmx3200m -Dclojure.main.report=stderr
  resource_class: large # default is medium. large (may) give us more consistent CI results

# Runners for OpenJDK

executors:
  jdk8:
    docker:
      - image: clojure:temurin-8-noble
    <<: *defaults
  jdk11:
    docker:
      - image: clojure:temurin-11-noble
    <<: *defaults
  jdk17:
    docker:
      - image: clojure:temurin-17-noble
    <<: *defaults
  jdk21:
    docker:
      - image: clojure:temurin-21-noble
    <<: *defaults
  jdk25:
    docker:
      - image: clojure:temurin-25-noble
    <<: *defaults
  jdk26:
    docker:
      - image: clojure:temurin-26-noble
    <<: *defaults

# Runs a given set of steps, with some standard pre- and post-
# steps, including restoring of cache, saving of cache.
#
# Adapted from https://github.com/lambdaisland/meta/blob/master/circleci/clojure_orb.yml

commands:
  with_cache:
    description: |
      Run a set of steps with Maven dependencies and Clojure classpath cache
      files cached.
      This command restores ~/.m2 and .cpcache if they were previously cached,
      then runs the provided steps, and finally saves the cache.
      The cache-key is generated based on the contents of `deps.edn` present in
      the `working_directory`.
    parameters:
      steps:
        type: steps
      files:
        description: Files to consider when creating the cache key
        type: string
        default: "deps.edn build/main.clj"
      cache_version:
        type: string
        description: "Key used to identify unique cache"
        default: "1"
    steps:
      - run:
          name: Generate Cache Checksum
          command: |
            for file in << parameters.files >>
            do
              find . -name $file -exec cat {} +
            done | sha256sum | awk '{print $1}' > /tmp/clojure_cache_seed
      - restore_cache:
          key: cache-<< parameters.cache_version >>-{{ checksum "/tmp/clojure_cache_seed" }}
      - steps: << parameters.steps >>
      - save_cache:
          paths:
            - ~/.m2
            - ~/.gitlibs
            - .cpcache
          key: cache-<< parameters.cache_version >>-{{ checksum "/tmp/clojure_cache_seed" }}

  prepare_deps:
    description: |
      Resolve the dependencies for the build tooling and the given alias
      groups up front, retrying on failure. Computing a classpath occasionally
      dies with a ClassCastException from HashMap internals: Maven's model
      validator caches the coordinates it has validated in an unsynchronized
      HashSet, and tools.deps resolves on several threads at once. It strikes
      whenever .cpcache misses, on JDK 8 and JDK 26 alike, and a retry is all
      it takes.
    parameters:
      aliases:
        description: |
          Space-separated alias groups to prepare, e.g. ":1.12:dev:test :kondo"
        type: string
    steps:
      - run:
          name: Preparing dependencies
          command: |
            prepare() {
              clojure -P -T:build || return 1
              for aliases in << parameters.aliases >>; do
                clojure -P -M"$aliases" || return 1
              done
            }
            attempt=1
            until prepare; do
              if [ "$attempt" -ge 3 ]; then
                echo "Giving up after $attempt attempts."
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Downloading dependencies failed, retrying..."
              sleep 5
            done

jobs:

  lint:
    description: |
      Running utility commands/checks (linter etc.)
    parameters:
      clojure_version:
        type: string
        default: "1.12"
    executor: jdk26
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
    steps:
      - checkout
      - with_cache:
          cache_version: "util_v3_<< parameters.clojure_version >>"
          steps:
            - prepare_deps:
                aliases: ":eastwood :cljfmt :kondo"
            - run:
                name: Running Eastwood
                command: |
                  make eastwood
            - run:
                name: Running cljfmt
                command: |
                  make cljfmt
            - run:
                name: Running clj-kondo
                command: |
                  make kondo
            - run:
                name: Verifying Cljdoc
                command: |
                  make verify-cljdoc
            - run:
                name: Verifying Ops Docs
                command: |
                  make verify-docs

  deploy:
    executor: jdk8
    steps:
      - checkout
      - run:
          name: Deploy
          command: make deploy

  test:
    description: |
      Run tests against given version of JDK and Clojure
    parameters:
      jdk_version:
        type: string
      clojure_version:
        type: string
      extra_aliases:
        type: string
        default: ""
    executor: << parameters.jdk_version >>
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
      EXTRA_ALIASES: << parameters.extra_aliases >>
    steps:
      - checkout
      - with_cache:
          cache_version: "test_v2_<< parameters.clojure_version >>"
          steps:
            - prepare_deps:
                aliases: ":<< parameters.clojure_version >>:dev:test<< parameters.extra_aliases >>"
            - run:
                name: Running tests
                command: make test
            - store_test_results:
                path: test-results

  test-windows:
    description: |
      Run tests on MS-Windows with Temurin JDK 21 and Clojure 1.12.
    executor: win/default
    steps:
      - checkout
      - run:
          name: Install the JDK and the Clojure CLI
          command: |
            choco install temurin21 --no-progress -y; if(-not $?){exit 9}
            Invoke-WebRequest -Uri "https://github.com/casselc/clj-msi/releases/download/v1.12.5.1645/clojure-1.12.5.1645.msi" -OutFile install.msi
            Start-Process msiexec.exe -Wait -ArgumentList "/i install.msi /qn"
      - restore_cache:
          key: windows-cache-1-{{ checksum "deps.edn" }}
      - run:
          name: Running tests on Windows
          command: |
            $env:JAVA_HOME = (Get-ChildItem 'C:\Program Files\Eclipse Adoptium\jdk-21*' | Select-Object -First 1).FullName
            if (-not $env:JAVA_HOME) { Write-Error "Temurin JDK 21 not found"; exit 9 }
            $env:Path = "$env:JAVA_HOME\bin;$env:Path"
            java -version; if(-not $?){exit 9}
            clojure -T:build javac :with-tests true; if(-not $?){exit 9}
            clojure -M:dev:test; if(-not $?){exit 9}
      - save_cache:
          key: windows-cache-1-{{ checksum "deps.edn" }}
          paths:
            - C:\Users\circleci\.m2
            - .cpcache
      - store_test_results:
          path: test-results

run_always: &run_always
  filters:
    branches:
      only: /.*/
    tags:
      only: /.*/

workflows:
  ci-test-matrix:
    jobs:
      - test:
          matrix:
            alias: "test-1.12"
            parameters:
              clojure_version: ["1.12"]
              jdk_version: [jdk17, jdk21, jdk25, jdk26]
          <<: *run_always
      - test:
          matrix:
            alias: "test-1.12-junixsocket"
            parameters:
              clojure_version: ["1.12"]
              jdk_version: [jdk8, jdk11]
              # JDK8 and 11 need junitsocket library to support sockets as
              # connection target.
              extra_aliases: [":+junixsocket"]
          <<: *run_always
      - test:
          matrix:
            alias: "test-1.13"
            parameters:
              clojure_version: ["1.13"]
              jdk_version: [jdk17, jdk21, jdk25, jdk26]
          <<: *run_always
      - test:
          matrix:
            alias: "test-older"
            parameters:
              clojure_version: ["1.10", "1.11"]
              jdk_version: [jdk8, jdk26]
          <<: *run_always
      - test-windows:
          <<: *run_always
      - lint:
          <<: *run_always
      # Releases, prereleases and snapshots all go through the same gate: the
      # whole matrix has to be green first. A vX.Y.Z-SNAPSHOT tag is the way
      # to exercise the full release path without cutting a release.
      - deploy:
          requires:
            - test-1.12
            - test-1.12-junixsocket
            - test-1.13
            - test-older
            - test-windows
            - lint
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\d+)?$/
                - /^v\d+\.\d+\.\d+-SNAPSHOT$/
