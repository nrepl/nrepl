name: nrepl
title: nREPL
# The docs version comes from the git ref: a release tag like v1.9.0 becomes
# 1.9 (patch versions never appear in the docs), anything else is unversioned,
# which makes master the site's default version. So a release doesn't have to
# touch this. docs.nrepl.org names the unversioned docs "master" in its version
# menu; doing that here with display_version would stick to every release.
version:
  v(?<major>+({0..9})).(?<minor>+({0..9})).*: $<major>.$<minor>
  '*': ~
nav:
- modules/ROOT/nav.adoc
asciidoc:
  attributes:
    # The versions the manual's snippets pin. Bump nrepl-version on the release
    # commit. Pages reference them as {nrepl-version}; code blocks need
    # subs="attributes+" for that.
    nrepl-version: '1.8.0'
    drawbridge-version: '0.4.0'
