name: nrepl
title: nREPL
# The release commit sets this to the major.minor version, quoted (e.g. "1.8"):
# unquoted, YAML reads 2.0 as the number 2 and the site shows "2". Patch
# versions never appear here. Between releases it stays unversioned (~), which
# makes master the site's default version.
version: ~
# What the version menu calls the unversioned master docs (otherwise "default").
display_version: master
nav:
- modules/ROOT/nav.adoc
asciidoc:
  attributes:
    # The versions the manual's snippets pin. Bump nrepl-version on the release
    # commit, together with the version above. Pages reference them as
    # {nrepl-version}; code blocks need subs="attributes+" for that.
    nrepl-version: '1.7.0'
    drawbridge-version: '0.4.0'
